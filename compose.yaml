services:
  db:
    image: postgres:15
    container_name: auth-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  spring-app:
    build: .
    container_name: auth-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always

volumes:
  postgres-data: