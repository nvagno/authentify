<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>Login</title>
</head>
<body>

<div class="card">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post" th:object="${user}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="text" name="username" th:field="${user.email}" placeholder="Username" required>
        <input type="password" name="password" th:field="${user.password}" placeholder="Password" required>

        <button type="submit">Connexion</button>
    </form>

    <p class="message">
        Don't have an account ?
        <a th:href="@{/register}">Register</a>
    </p>
</div>

</body>
</html>
